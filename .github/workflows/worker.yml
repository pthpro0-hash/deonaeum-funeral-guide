name: 인생 노트 알림 서버 배포

# Cloudflare Workers 무료 구간. 저장소 Secrets에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 가 있어야 배포한다.
# 없으면 건너뛴다(사이트 배포에는 영향 없음).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'tests/push.test.mjs', '.github/workflows/worker.yml']

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 테스트
        run: node --test tests/*.test.mjs
      - name: Cloudflare 설정 확인
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare Secrets가 없어 배포를 건너뜁니다."; echo "ready=no" >> "$GITHUB_OUTPUT"
          else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - name: KV 저장소 찾기 또는 만들기
        if: steps.cf.outputs.ready == 'yes'
        working-directory: worker
        run: |
          find_id() { npx --yes wrangler@3 kv namespace list | jq -r '[.[] | select(.title | test("deonaeum-life-note"; "i"))][0].id // empty'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx --yes wrangler@3 kv namespace create PUSH; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
      - name: 배포
        if: steps.cf.outputs.ready == 'yes'
        working-directory: worker
        run: npx --yes wrangler@3 deploy
