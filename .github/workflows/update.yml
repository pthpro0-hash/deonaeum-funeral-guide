name: 공식 자료 주간 갱신 · 배포

# GitHub 서버에서 돈다. 내 PC가 꺼져 있어도 매주 갱신된다.
# 인증키가 필요 없다(공공데이터포털 파일데이터, 공정위 공개 XLS, OSM 지오코딩).

on:
  schedule:
    # 매주 월요일 05:00 KST = 일요일 20:00 UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', 'tests/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    # 코드 push 때는 자료를 다시 받지 않고 배포만 한다.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 자료 받기 · 점수 계산 · 새 주소만 지오코딩
        run: python -m pipeline.build
      - name: 테스트
        run: python -m pytest -q pipeline/tests
      - name: 바뀐 자료 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/geocache.json data/ftc-detail.json
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data: 공식 자료 주간 갱신 $(date -u +%F)"
            git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 계산기 테스트
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
